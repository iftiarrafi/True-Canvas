services:
  redis:
    image: redis:7-alpine
    container_name: truecanvas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truecanvas-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - AI_CHECKER_URL=http://ai-image-checker:5000/check_image
      - PORT=4000
    depends_on:
      redis:
        condition: service_healthy
      ai-image-checker:
        condition: service_started
    restart: unless-stopped

  ai-image-checker:
    build:
      context: ./ai_image_checker
      dockerfile: Dockerfile
    container_name: truecanvas-ai-image-checker
    expose:
      - "5000"
    restart: unless-stopped

volumes:
  redis_data:
